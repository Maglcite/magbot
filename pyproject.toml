[project]
name = "magbot"
version = "2.0.0"
description = "AI chat bot for Stoat.chat with tools, memory and opt-in consent"
requires-python = ">=3.11"
dependencies = ["stoat.py==1.2.1", "aiohttp>=3.9", "openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["magbot", "magbot.tools", "magbot.commands"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
